<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkOverlay - 제휴 마케팅 CTA 오버레이 도구</title>
    <meta name="description" content="외부 유용한 콘텐츠에 내 브랜드 또는 제휴 마케팅 CTA 배너를 부착하고 단축 링크를 생성하는 오버레이 도구" />
    <meta property="og:title" content="LinkOverlay - 제휴 마케팅 CTA 오버레이 도구" />
    <meta property="og:description" content="외부 유용한 콘텐츠에 내 브랜드 또는 제휴 마케팅 CTA 배너를 부착하고 단축 링크를 생성하는 오버레이 도구" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        // 1. Mock dummy WebSocket for Vite HMR in AI Studio sandboxed container
        try {
          var origWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (urlStr.indexOf('vite') !== -1 || urlStr.indexOf('localhost') !== -1 || urlStr.indexOf('run.app') !== -1) {
              var listeners = {};
              var dummy = {
                readyState: 1, // OPEN
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() { fn({ type: 'open' }); }, 10);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              setTimeout(function() {
                if (typeof dummy.onopen === 'function') dummy.onopen({ type: 'open' });
              }, 10);
              return dummy;
            }
            return new origWebSocket(url, protocols);
          };
          if (origWebSocket) {
            window.WebSocket.prototype = origWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        // 2. Filter benign Vite HMR logs and errors in both English and Korean
        function isViteHmrText(text) {
          if (!text) return false;
          var t = String(text);
          return (
            t.indexOf('WebSocket closed without opened') !== -1 ||
            t.indexOf('failed to connect to websocket') !== -1 ||
            t.indexOf('웹소켓 연결에 실패') !== -1 ||
            t.indexOf('웹소켓이 열리지 않고') !== -1 ||
            t.indexOf('웹소켓') !== -1 && t.indexOf('vite') !== -1 ||
            t.indexOf('[vite] 연결 중') !== -1
          );
        }

        var origError = console.error;
        console.error = function() {
          var text = Array.prototype.slice.call(arguments).map(function(item) {
            return (item && item.message) || String(item);
          }).join(' ');
          if (isViteHmrText(text)) return;
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var text = Array.prototype.slice.call(arguments).map(function(item) {
            return (item && item.message) || String(item);
          }).join(' ');
          if (isViteHmrText(text)) return;
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason || '');
          var msg = typeof reason === 'string' ? reason : ((reason && reason.message) || '');
          if (isViteHmrText(msg)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          if (isViteHmrText(msg)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
